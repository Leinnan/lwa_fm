[package]
name = "dirfleet_ffi"
version = "0.0.1"
description = "The core and its Rust effect handlers behind a BoltFFI bridge, for native shells."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
codegen = ["dep:anyhow", "dep:clap", "dep:log", "dep:pretty_env_logger", "facet_typegen"]
# Read by the `#[effect]` macro in this crate.
facet_typegen = ["dirfleet_core/facet_typegen", "crux_core/facet_typegen"]

[dependencies]
dirfleet_core = { path = "../dirfleet_core" }
dirfleet_effects = { path = "../dirfleet_effects" }
crux_core = "=0.20.0"
facet = "=0.46.5"
# The version crux_core 0.20.0's examples use; `boltffi_cli` must match.
boltffi = "=0.29.3"
serde = { version = "1", features = ["derive"] }

anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }
pretty_env_logger = { version = "0.5", optional = true }

[dev-dependencies]
crux_core = { version = "=0.20.0", features = ["testing"] }
serde_json = "1"
toml = "1"

[lints]
workspace = true
