[package]
name = "dirfleet_winshell"
version = "0.0.1"
description = "DirFleet's Explorer integration on Windows: Properties, Open with, pickers, the shell context menu and file drags, for every Windows shell."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

# Windows only; other systems build an empty library.
[target.'cfg(windows)'.dependencies]
log = "0.4"
# The version the rest of the workspace uses. None of its types are in this
# crate's public API, so a shell on another windows-rs revision can use it.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
