[workspace]
members = [".", "crates/dirfleet_core", "crates/dirfleet_effects", "crates/dirfleet_ffi", "crates/dirfleet_winshell", "windows"]
# vendor/puffin_egui joins as a path dependency; plain `cargo test` leaves it out.
# `windows` (the native Windows shell) is built by name: `cargo run -p dirfleet_windows`.
default-members = [".", "crates/dirfleet_core", "crates/dirfleet_effects", "crates/dirfleet_ffi", "crates/dirfleet_winshell"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Piotr Siuszko"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
nursery = { level = "deny", priority = 0 }
pedantic = { level = "deny", priority = 1 }
enum_glob_use = { level = "deny", priority = 2 }
module_name_repetitions = { level = "allow", priority = 3 }
cast_precision_loss = { level = "allow", priority = 4 }
cast_possible_truncation = { level = "allow", priority = 5 }
cast_sign_loss = { level = "allow", priority = 6 }
out_of_bounds_indexing = { level = "allow", priority = 7 }
perf = { level = "warn", priority = 8 }
style = { level = "warn", priority = 9 }
# this should be active but for that anyhow should be used everywhere
unwrap_used = { level = "deny", priority = 10 }

[package]
name = "lwa_fm"
edition = "2024"
rust-version = "1.95"
version = "0.0.1"
authors = ["Piotr Siuszko"]
homepage = "https://github.com/Leinnan/lwa_fm"

[profile.release]
opt-level = 3
codegen-units = 1
panic = 'abort'
lto = "fat"
strip = true

# Size-optimised build for distribution comparisons: `cargo build --profile release-small`.
[profile.release-small]
inherits = "release"
opt-level = 'z'

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[features]
default = []
profiling = ["dep:puffin", "dep:puffin_http", "dep:puffin_egui", "profiling/profile-with-puffin", "dirfleet_effects/profiling"]

[dependencies]
dirfleet_core = { path = "crates/dirfleet_core" }
dirfleet_effects = { path = "crates/dirfleet_effects" }
crux_core = "=0.20.0"
lucide-icons = "=1.67.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sled = "0.34"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
toml = "1"
# Reads egui memory saved by earlier builds (`src/legacy_import.rs`); eframe uses the same version.
ron = "0.12"
log = { version = "0.4.28", features = ["std"] }
profiling = { version = "1.0.18", default-features = false }
# Keep the profiler UI on the same egui version as the app.
puffin = {optional = true, git = "https://github.com/EmbarkStudios/puffin.git", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
puffin_http = {optional = true, git = "https://github.com/EmbarkStudios/puffin.git", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
puffin_egui = { optional = true, path = "vendor/puffin_egui" }
# Only collation is used; the `icu` umbrella crate pulls in every component and its data.
notify = "6.1"
smallvec = "1.15"
fuzzy-matcher = "0.3"
# NFC folding, so names stored decomposed (HFS+, SMB) match typed text.
unicode-normalization = "0.1"
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",     # Screen-reader support (VoiceOver, Narrator, Orca).
    "default_fonts", # Embed the default egui fonts.
    "wgpu_no_default_features", # WGPU renderer; backends are picked per OS below.
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "clipboard",     # Text copy/paste; off without default features since eframe 0.37.
    "system_fonts",  # Emoji and non-Latin file names through system font fallback.
] }
egui = "=0.37.0"
open = "5.3"
walkdir = "2"
sysinfo = "0.33"
directories = "6"
# Only the formats previewed (`src/app/assets/kinds.rs`); the defaults add AVIF, EXR, HDR, ...
image = { version = "0.25", default-features = false, features = ["rayon", "png", "jpeg", "bmp", "webp", "tiff", "ico", "tga", "gif"] }
# Only its paths/URLs: downloading goes through the system `curl` and `tar`
# (`src/app/assets/ffmpeg_install.rs`) instead of an in-process HTTP + TLS + zip stack.
ffmpeg-sidecar = { version = "2.4.0", default-features = false }
# SHA-256 check of the downloaded FFmpeg archive.
sha2 = "0.10"
rand = "0.8"
anyhow = "1"
crossbeam = "0.8"
# Unreleased egui 0.37 bump (anhosh/egui_dock#354); go back to crates.io once released.
egui_dock = { git = "https://github.com/crumblingstatue/egui_dock.git", rev = "4bd1dcd90c7a71ed3bf38159f49a2992fa653c2c", features = ["serde"] }
trash = "5.2"
arboard = "3.4.1"
embed_plist = "1.2"
rayon = "1.10"
bincode = "=2.0.1"
egui_taffy = "=0.15.0"
lru = "0.16.3"
glob = "0.3"
# Unicode classes beyond case folding and \w/\d/\s (scripts, ages, ...) are rarely used in file names.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Backends (and their shader translators) are the bulk of the renderer's
# size, so each OS only gets the one it uses; see the target sections below.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
mimalloc = { version = "0.1", default-features = false }
foldhash = "0.2"
fixedbitset = "0.5"
jpeg-decoder = { version = "0.3", default-features = false }
raw-window-handle = "0.6"
# Shared with other egui apps. Every egui_mev_* crate must use the same rev: two revs
# compile two copies, and their types do not match.
egui_mev_app = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994", features = ["chrome", "wgpu"] }
egui_mev_commands = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }
egui_mev_core = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }
egui_mev_data = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }
egui_mev_tasks = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }
egui_mev_theme = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994", features = ["lucide", "native", "serde"] }
egui_mev_widgets = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }

[patch.crates-io]
puffin = { git = "https://github.com/EmbarkStudios/puffin.git", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }
# Explorer integration (`src/windows_tools.rs`, `src/native_drag.rs`), shared with the native shell.
dirfleet_winshell = { path = "crates/dirfleet_winshell" }
# Only the focused window and its pointer; the shell calls are in `dirfleet_winshell`.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Drag files out to other apps (Windows uses the shell directly); objc2 for
# the pasteboard and open panel (`src/macos_tools.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
drag = "=2.1.1"
wgpu = { version = "30", default-features = false, features = ["metal"] }
egui-wgpu = { version = "=0.37.0", default-features = false, features = ["macos-window-resize-jitter-fix"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
systemicons = { git = "https://github.com/Leinnan/systemicons.git" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
dirfleet_effects = { path = "crates/dirfleet_effects", features = ["test-support"] }
# Harnesses have no system font fallback, so the bundled symbols keep glyphs like the
# saved-search star drawn the same on every machine. Not for release builds, where
# these would win over system color emoji.
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
egui_kittest = { version = "=0.37.0", features = ["snapshot", "wgpu"] }
egui-winit = { version = "=0.37.0", features = ["accesskit"] }
egui_mev_test = { git = "https://github.com/Leinnan/egui_mev_toolkit", rev = "039b0f9d062772e82dd990fb5a23b73fad5d9994" }

[build-dependencies]
anyhow = "1.0"
winresource = "0.1.19"

[lints]
workspace = true

[package.metadata.bundle]
name = "DirFleet"
# The MSI uses the first one, so the .ico has to stay first.
icon = ["static/icon.ico", "static/window_icon.png"]
identifier = "io.github.leinnan.dirfleet"
osx_url_schemes = ["io.github.leinnan.dirfleet"]
short_description = "File Manager"
long_description = "File Manager built with egui in Rust"
# The privacy strings and the rest of the hand-written plist (`just build_mac_app` uses it as is).
osx_info_plist_exts = ["static/Info.plist"]
osx_minimum_system_version = "11.0"
