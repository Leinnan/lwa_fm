# Feature parity between the egui app and the native macOS and Windows apps.
#
# One entry per user-visible feature of the egui app (and the few the Mac
# app adds), grouped by the areas of `parity.md`. Checked by `just parity`
# (`crates/dirfleet_ffi/tests/parity.rs`).
#
# Features the egui app never had go in areas 24 and up (24 Archives,
# 25 Remote locations, 26 Results, 27 Tags) or in the area they belong to.
# Such an entry has no `egui_ref` and its `notes` start "Not in the egui app".
#
# status:       "open" — the Mac app doesn't have it through the core yet
#               "done" — it does, and `core_test` and `swift_test` prove it
#               "na"   — not wanted in the Mac app; `na_mac` says why
# egui_on_core: true once the egui app also uses the core for it and its old
#               code is gone (default false)
# events:       the core `Event` variants this feature introduced; every
#               variant must appear in some entry
# windows:      the native Windows shell (`windows/`): "open" (the default),
#               "done" — the shell has it, on the core; or "na" with
#               `na_windows` saying why. That shell has no UI tests yet, so
#               "done" asks for no test; `windows_test` names the unit tests
#               of its pure parts
# *_test:       test function names; each must exist

