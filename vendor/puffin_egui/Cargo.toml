[package]
name = "puffin_egui"
version = "0.30.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
categories = ["development-tools::profiling", "game-development", "gui"]
description = "Show puffin profiler flamegraph in-game using egui"
edition = "2024"
homepage = "https://github.com/EmbarkStudios/puffin"
keywords = ["profiler", "gamedev", "gui"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EmbarkStudios/puffin"
rust-version = "1.95"
include = [
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "**/*.rs",
    "Cargo.toml",
    "README.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = { version = "=0.36.2", default-features = false }
egui_extras = { version = "=0.36.2", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
log = "0.4.29"
log-once = "0.4"
natord = "1.0.9"
parking_lot = "0.12"
puffin = { version = "0.20.0", git = "https://github.com/EmbarkStudios/puffin.git", rev = "7e08a533f9debfb7d051547263d2ab84c666314f", features = ["packing"] }
serde = { version = "1.0.228", features = ["derive", "rc"], optional = true }
time = { version = "0.3.47", default-features = false, features = ["formatting", "macros"] }
vec1 = "1.12"
web-time = "1.1"

[dev-dependencies]
eframe = { version = "=0.36.2", features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
