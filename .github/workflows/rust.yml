name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v2
      # GTK for systemicons, Vulkan (lavapipe) so the snapshot tests can render without a GPU.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      # There are no Linux baselines and lavapipe rasterizes differently, so re-record
      # the snapshots instead of comparing them; every other assertion still fails the job.
      - name: Re-record snapshots on Linux
        if: runner.os == 'Linux'
        run: echo "UPDATE_SNAPSHOTS=1" >> "$GITHUB_ENV"
      - name: Validate
        run: just validate
      - name: Validate profiling
        run: |
          cargo check --locked --features profiling
          cargo test --locked --features profiling
          cargo clippy --locked --all-targets --features profiling -- -D warnings

  # The native macOS shell: the Rust core packaged for Swift, built with Xcode
  # and checked against the same golden view models as the Rust tests.
  native:
    name: native macOS shell
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: extractions/setup-just@v2
      - name: Install xcodegen and boltffi
        run: |
          brew install xcodegen
          version=$(sed -n 's/^boltffi_version := "\(.*\)"/\1/p' justfile)
          boltffi --version 2>/dev/null | grep -q " $version$" || cargo install boltffi_cli --version "=$version" --locked
      - name: Test the native shell
        run: just apple-test
